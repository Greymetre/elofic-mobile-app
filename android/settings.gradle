pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }

// Apps launched from Finder/Dock do not inherit the shell PATH on macOS, so
// Android Studio may be unable to find a Homebrew-installed Node executable.
def nodeExecutable = System.getenv("NODE_BINARY")
if (!nodeExecutable) {
    nodeExecutable = [
        "/opt/homebrew/opt/node@22/bin/node",
        "/opt/homebrew/bin/node",
        "/usr/local/bin/node"
    ].find { new File(it).canExecute() } ?: "node"
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand([nodeExecutable, "../node_modules/@react-native-community/cli/build/bin.js", "config"])
}
rootProject.name = 'FieldConnect'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
